<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>BCM Debug</title>
    <style>
        .page { display: none; }
        .page.active { display: block; }
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; }
    </style>
</head>
<body>
    <h1>BCM Debug Test</h1>
    
    <div>
        <button onclick="navigateTo('homePage')">Home</button>
        <button onclick="navigateTo('plansPage')">Plans</button>
        <button onclick="navigateTo('contactsPage')">Contacts</button>
        <button onclick="activateCrisisMode()">Crisis Mode</button>
    </div>
    
    <div class="page active" id="homePage">
        <h2>HOME PAGE</h2>
        <p>This is the home page</p>
        <button onclick="navigateTo('plansPage')">Go to Plans</button>
    </div>
    
    <div class="page" id="plansPage">
        <h2>PLANS PAGE</h2>
        <div id="plansGrid"></div>
        <button onclick="navigateTo('homePage')">Back to Home</button>
    </div>
    
    <div class="page" id="contactsPage">
        <h2>CONTACTS PAGE</h2>
        <div id="contactsGrid"></div>
        <button onclick="navigateTo('homePage')">Back to Home</button>
    </div>
    
    <div class="page" id="crisisModePage">
        <h2>CRISIS MODE</h2>
        <div id="scenariosGrid"></div>
        <button onclick="navigateTo('homePage')">Back to Home</button>
    </div>
    
    <script src="crisis-data.js"></script>
    <script src="app-new.js"></script>
    <script src="crisis-app.js"></script>
    <script src="plans-app.js"></script>
    
    <script>
        console.log('Debug: Scenarios loaded:', scenarios ? scenarios.length : 'NO');
        console.log('Debug: Plans loaded:', plans ? plans.length : 'NO');
        console.log('Debug: Contacts loaded:', contacts ? contacts.length : 'NO');
        console.log('Debug: navigateTo:', typeof navigateTo);
        console.log('Debug: activateCrisisMode:', typeof activateCrisisMode);
    </script>
</body>
</html>
